name: Publish v3.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3.1.0.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Generate release notes
        shell: pwsh
        run: |
          $installer = Get-Item "packaging\output\ENC-Inverter-Editor-3.1.0-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          @"
          ## ENC Inverter Parameter Editor 3.1.0

          Windows installer for ENC Inverter Parameter Editor.

          ### Changes

          - Added a Windows installer and portable PyInstaller build workflow.
          - Highlighted non-default inverter parameter values.
          - Added dependency-aware write ordering for safer parameter restoration.
          - Included localized parameter-group names and EN600/EDS800 profiles.

          ### Installation

          Download **ENC-Inverter-Editor-3.1.0-Setup.exe** and run it. The installer supports Russian and English and upgrades an existing installation.

          > The installer is not digitally signed. Windows SmartScreen may display a warning.

          SHA-256:

          $hash
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.1.0 `
            "packaging\output\ENC-Inverter-Editor-3.1.0-Setup.exe" `
            --target "$env:GITHUB_SHA" `
            --title "ENC Inverter Parameter Editor 3.1.0" `
            --notes-file release-notes.md
